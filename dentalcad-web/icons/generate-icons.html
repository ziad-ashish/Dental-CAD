<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body>
<h3>DentalCAD — PWA Icon Generator</h3>
<p>Click each button to download the PNG icon at the required size.</p>
<div id="status"></div>
<script>
const SVG_SRC = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#111318"/>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <path d="M256 80 C200 80 160 120 160 170 C160 210 175 240 196 260 L196 390 C196 406 208 420 224 420 C240 420 252 406 252 390 L252 360 L260 360 L260 390 C260 406 272 420 288 420 C304 420 316 406 316 390 L316 260 C337 240 352 210 352 170 C352 120 312 80 256 80 Z" fill="url(#g1)" opacity="0.95"/>
  <ellipse cx="220" cy="145" rx="18" ry="32" fill="white" opacity="0.25" transform="rotate(-15 220 145)"/>
</svg>`;

function generatePNG(size, filename) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const blob = new Blob([SVG_SRC], {type:'image/svg+xml'});
  const url  = URL.createObjectURL(blob);
  img.onload = () => {
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
    canvas.toBlob(pngBlob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(pngBlob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      document.getElementById('status').innerHTML +=
        `<p>✔ Downloaded: <b>${filename}</b> (${size}×${size}px)</p>`;
    }, 'image/png');
  };
  img.src = url;
}

// Auto-generate both on load
window.onload = () => {
  setTimeout(() => generatePNG(192, 'icon-192.png'), 300);
  setTimeout(() => generatePNG(512, 'icon-512.png'), 800);
};
</script>
</body>
</html>
