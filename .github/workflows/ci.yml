name: DentalCAD acceptance

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run build
      - shell: pwsh
        run: git diff --check
